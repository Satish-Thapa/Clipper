<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipper login</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #1A1A1A; --card: #2A2A2A; --line: #3a3a3a; --text: #EDEDED; --muted: #9a9a9a; --green: #76B900; --bad: #FF5A5F;
  --font: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 14px var(--font); }
.card { width: min(380px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.mark { width: 32px; height: 32px; border-radius: 7px; background: linear-gradient(135deg, var(--green), #3c6000); display: grid; place-items: center; box-shadow: 0 0 18px rgba(118,185,0,.22); }
.mark svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
h1 { margin: 0; font-size: 18px; } p { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
input { font: 14px var(--font); color: var(--text); background: #1f1f1f; border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 12px; width: 100%; }
input:focus { outline: 2px solid var(--green); outline-offset: 1px; border-color: transparent; }
button { width: 100%; font: 700 14px var(--font); padding: 12px; border: 0; border-radius: 8px; background: var(--green); color: #182200; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.err { color: var(--bad); font-size: 12px; min-height: 18px; margin: -4px 0 10px; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><h1>Clipper</h1></div>
  <p>Log in to continue. You stay logged in for 24 hours.</p>
  <label>User<input name="user" id="user" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
  <label>Password<input name="password" id="password" type="password" autocomplete="current-password" required></label>
  <div class="err" id="err" role="alert"></div>
  <button id="go">Log in</button>
</form>
<script>
const nxt = (() => { const n = new URLSearchParams(location.search).get("next") || "/"; return n.startsWith("/") && !n.startsWith("//") && !n.startsWith("/\\") ? n : "/"; })();
document.getElementById("user").focus();
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user: document.getElementById("user").value, password: document.getElementById("password").value})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : `HTTP ${r.status}`);
    location.replace(nxt);
  } catch (x) { err.textContent = x.message; document.getElementById("password").select(); }
  finally { go.disabled = false; }
};
</script>
</body>
</html>
